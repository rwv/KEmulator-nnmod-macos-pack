name: Build macOS App

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

env:
  KEMULATOR_VERSION: "2.20"

jobs:
  pack-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, aarch64]
        extension: [zip, dmg]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK (with jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "24"
          architecture: ${{ matrix.arch }}

      - name: Download Kemulator Release
        run: |
          curl -L -o kemnnx64.zip "https://github.com/shinovon/KEmulator/releases/download/v${{ env.KEMULATOR_VERSION }}/kemnnx64.v${{ env.KEMULATOR_VERSION }}.zip"
          unzip kemnnx64.zip
          ls -la kemnnx64/

      - name: Replace with lateset swt library
        run: |
          curl -L -o kemnnx64/swt-macosx-aarch64.jar https://repo1.maven.org/maven2/org/eclipse/platform/org.eclipse.swt.cocoa.macosx.aarch64/3.131.0/org.eclipse.swt.cocoa.macosx.aarch64-3.131.0.jar
          curl -L -o kemnnx64/swt-macosx-x86_64.jar https://repo1.maven.org/maven2/org/eclipse/platform/org.eclipse.swt.cocoa.macosx.x86_64/3.131.0/org.eclipse.swt.cocoa.macosx.x86_64-3.131.0.jar

      - name: Fix lwjgl natives for macos x64
        run: |
          cp ./kemnnx64/lwjgl-glfw-natives-macos.jar ./kemnnx64/lwjgl-glfw-natives-macos-x86.jar
          cp ./kemnnx64/lwjgl-natives-macos.jar ./kemnnx64/lwjgl-natives-macos-x86.jar
          cp ./kemnnx64/lwjgl-opengl-natives-macos.jar ./kemnnx64/lwjgl-opengl-natives-macos-x86.jar
          cp ./kemnnx64/lwjgl3-swt-macos.jar ./kemnnx64/lwjgl3-swt-macos-x86.jar

      - name: Use the latest libjinput-osx native library to support macos aarch64
        run: |
          rm ./kemnnx64/libjinput-osx.dylib ./kemnnx64/libjinput-osx.jnilib
          curl -L -o osx-plugin-2.0.10-natives-osx.jar "https://repo1.maven.org/maven2/net/java/jinput/osx-plugin/2.0.10/osx-plugin-2.0.10-natives-osx.jar"
          unzip -j osx-plugin-2.0.10-natives-osx.jar "libjinput-osx.jnilib" -d "./kemnnx64/"

      - name: Stage macOS files for macos aarch64
        if: matrix.arch == 'aarch64'
        run: |
          rm -rf "./build-mac/"
          rsync -a --delete \
            --exclude='.package' \
            --exclude='*.dll' \
            --exclude='*.so' \
            --exclude='*linux*' \
            --exclude='*windows*' \
            --exclude='*android*' \
            --exclude='*win32*' \
            --exclude='*.sh' \
            --exclude='*.bat' \
            --exclude='*x86*' \
            --exclude='lwjgl-glfw-natives-macos.jar' \
            --exclude='lwjgl-natives-macos.jar' \
            --exclude='lwjgl-opengl-natives-macos.jar' \
            --exclude='lwjgl3-swt-macos.jar' \
            --exclude='libamrdecoder.dylib' \
            "./kemnnx64/" "./build-mac/"

      - name: Stage macOS files for macos x64
        if: matrix.arch == 'x64'
        run: |
          rm -rf "./build-mac/"
          rsync -a --delete \
            --exclude='.package' \
            --exclude='*.dll' \
            --exclude='*.so' \
            --exclude='*linux*' \
            --exclude='*windows*' \
            --exclude='*android*' \
            --exclude='*win32*' \
            --exclude='*.sh' \
            --exclude='*.bat' \
            --exclude='*aarch64*' \
            --exclude='*arm64*' \
            "./kemnnx64/" "./build-mac/"

      - name: Build .app with jpackage
        if: matrix.extension == 'zip'
        run: |
          rm -rf dist
          jpackage --type app-image \
            --name "KEmulator" \
            --app-version "${KEMULATOR_VERSION}" \
            --dest "dist" \
            --input "./build-mac" \
            --main-jar KEmulator.jar \
            --java-options '-Xmx512M' \
            --java-options '-Dfile.encoding=UTF-8' \
            --java-options '-Djava.library.path=$APPDIR/app' \
            --java-options '--enable-native-access=ALL-UNNAMED' \
            --vendor 'KEmulator nnmod' \
            --runtime-image "$JAVA_HOME"

      - name: Create app bundle zip
        if: matrix.extension == 'zip'
        run: |
          cd dist
          zip -r "KEmulator-v${{ env.KEMULATOR_VERSION }}-macos-${{ matrix.arch }}.app.zip" KEmulator.app/

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        if: matrix.extension == 'zip'
        with:
          name: KEmulator-v${{ env.KEMULATOR_VERSION }}-macos-${{ matrix.arch }}.app.zip
          path: dist/KEmulator-v${{ env.KEMULATOR_VERSION }}-macos-${{ matrix.arch }}.app.zip
          if-no-files-found: error

      - name: Upload release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/') && matrix.extension == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KEmulator-v${{ env.KEMULATOR_VERSION }}-macos-${{ matrix.arch }}.app.zip


      - name: Build .dmg with jpackage
        if: matrix.extension == 'dmg'
        run: |
          rm -rf dist
          jpackage --type dmg \
            --name "KEmulator" \
            --app-version "${KEMULATOR_VERSION}" \
            --dest "dist" \
            --input "./build-mac" \
            --main-jar KEmulator.jar \
            --java-options '-Xmx512M' \
            --java-options '-Dfile.encoding=UTF-8' \
            --java-options '-Djava.library.path=$APPDIR/app' \
            --java-options '--enable-native-access=ALL-UNNAMED' \
            --vendor 'KEmulator nnmod' \
            --runtime-image "$JAVA_HOME"

      - name: Rename dmg file
        if: matrix.extension == 'dmg'
        run: |
          mv dist/KEmulator-${KEMULATOR_VERSION}.dmg dist/KEmulator-v${{ env.KEMULATOR_VERSION }}-macos-${{ matrix.arch }}.dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        if: matrix.extension == 'dmg'
        with:
          name: KEmulator-v${{ env.KEMULATOR_VERSION }}-macos-${{ matrix.arch }}.dmg
          path: dist/KEmulator-v${{ env.KEMULATOR_VERSION }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Upload release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/') && matrix.extension == 'dmg'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KEmulator-v${{ env.KEMULATOR_VERSION }}-macos-${{ matrix.arch }}.dmg
