name: Build KEmulator macOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos-app:
    runs-on: macos-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Download KEmulator release
      run: |
        echo "Downloading KEmulator v2.20..."
        curl -L -o kemnnx64.v2.20.zip https://github.com/shinovon/KEmulator/releases/download/v2.20/kemnnx64.v2.20.zip
        echo "Download completed, file size:"
        ls -lh kemnnx64.v2.20.zip
        
    - name: Extract KEmulator
      run: |
        unzip kemnnx64.v2.20.zip
        ls -la
        
    - name: Examine KEmulator structure
      run: |
        echo "=== KEmulator directory structure ==="
        find . -name "*.jar" -o -name "*.sh" -o -name "*.bat" | head -20
        echo "=== Contents of extracted directory ==="
        ls -la kemnnx64/
        echo "=== Looking for main executable ==="
        find kemnnx64/ -name "*.jar" -o -name "*.sh" -o -name "*.bat"
        
    - name: Prepare jpackage input directory
      run: |
        echo "=== Preparing jpackage input directory ==="
        mkdir -p jpackage-input
        
    - name: Copy JAR files and dependencies
      run: |
        echo "=== Copying JAR files ==="
        # Copy KEmulator.jar as the main jar
        cp kemnnx64/KEmulator.jar jpackage-input/
        
        # Copy all dependency JARs to the input directory
        cp kemnnx64/*.jar jpackage-input/ 2>/dev/null || true
        cp kemnnx64/uei/*.jar jpackage-input/ 2>/dev/null || true
        
        echo "=== JAR files copied ==="
        find jpackage-input/ -name "*.jar" | wc -l
        
    - name: Copy native libraries
      run: |
        echo "=== Copying native libraries for macOS ==="
        # Copy native libraries for macOS
        cp kemnnx64/*.dylib jpackage-input/ 2>/dev/null || true
        cp kemnnx64/*.jnilib jpackage-input/ 2>/dev/null || true
        
    - name: Copy additional resources
      run: |
        echo "=== Copying additional resources ==="
        # Copy language files
        cp -r kemnnx64/lang jpackage-input/ 2>/dev/null || true
        
        echo "=== Input directory contents ==="
        ls -la jpackage-input/
        
    - name: Create macOS app with jpackage
      run: |
        echo "=== Creating macOS app bundle ==="
        jpackage \
          --input jpackage-input/ \
          --name "KEmulator" \
          --main-jar "KEmulator.jar" \
          --main-class "emulator.Emulator" \
          --type app-image \
          --dest ./output/ \
          --app-version "2.20" \
          --vendor "shinovon" \
          --description "KEmulator J2ME Emulator for macOS" \
          --java-options "-Xmx512M" \
          --java-options "-Djna.nosys=true" \
          --java-options "-Dfile.encoding=UTF-8" \
          --java-options "-XstartOnFirstThread" \
          --java-options "-XX:+IgnoreUnrecognizedVMOptions" \
          --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED" \
          --java-options "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED" \
          --java-options "--add-opens=java.base/java.lang.ref=ALL-UNNAMED" \
          --java-options "--add-opens=java.base/java.io=ALL-UNNAMED" \
          --java-options "--add-opens=java.base/java.util=ALL-UNNAMED" \
          --java-options "--enable-native-access=ALL-UNNAMED" \
          --java-options "-javaagent:\$APPDIR/KEmulator.jar" || {
            echo "jpackage failed with error code $?"
            echo "=== Checking Java version ==="
            java -version
            echo "=== Checking jpackage version ==="
            jpackage --version 2>/dev/null || echo "jpackage version not available"
            exit 1
          }
        echo "=== macOS app creation completed successfully ==="
        
    - name: List output
      run: |
        echo "=== Output directory ==="
        ls -la output/
        echo "=== App bundle contents ==="
        ls -la output/KEmulator.app/
        
    - name: Create distribution archive
      run: |
        cd output
        echo "=== Creating compressed archive ==="
        tar -czf KEmulator-macOS-v2.20.tar.gz KEmulator.app
        echo "=== Archive created ==="
        ls -lh *.tar.gz
        echo "=== Archive contents preview ==="
        tar -tzf KEmulator-macOS-v2.20.tar.gz | head -10
        
    - name: Upload macOS app artifact
      uses: actions/upload-artifact@v4
      with:
        name: KEmulator-macOS-App-v2.20
        path: output/KEmulator-macOS-v2.20.tar.gz
        retention-days: 30