name: Build KEmulator macOS App

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build KEmulator.app with bundled JRE
      run: |
        ./package-jpackage.sh
        
    - name: Verify app bundle
      run: |
        ./verify.sh
        
    - name: Create app bundle archive
      run: |
        zip -r KEmulator-macos.zip KEmulator.app
        
    - name: Upload app bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: KEmulator-macos
        path: KEmulator-macos.zip
        retention-days: 30